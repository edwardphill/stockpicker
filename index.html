<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockPicker — Picks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/terminal.css">
  <script src="assets/theme.js"></script>
  <style>
    table.main { min-width: 900px; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="logo">STOCK<span>PICKER</span><span class="go">GO</span></div>
    <div class="header-meta" id="last-updated">Loading...</div>
  </div>
  <div class="header-right">
    <div class="header-meta" id="pick-count">—</div>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">Light</button>
  </div>
</div>
<nav class="tabs">
  <a class="tab active" href="index.html"><span class="fk">1</span>Picks</a>
  <a class="tab" href="analysts.html"><span class="fk">2</span>Analyst Mismatch</a>
  <a class="tab" href="reports/weekly/latest.html"><span class="fk">3</span>Weekly Brief</a>
</nav>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-label" id="l-total">Stocks</div>
    <div class="stat-value" id="s-total">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Win Rate</div>
    <div class="stat-value" id="s-wr">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Avg Return</div>
    <div class="stat-value" id="s-avg">—</div>
    <div class="stat-note" id="s-mgd">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Best</div>
    <div class="stat-value green" id="s-best">—</div>
  </div>
  <div class="stat">
    <div class="stat-label">Worst</div>
    <div class="stat-value red" id="s-worst">—</div>
  </div>
</div>

<div class="toolbar">
  <span class="seg" id="view-seg">
    <button class="filter-btn active" data-view="stock">By stock</button>
    <button class="filter-btn" data-view="pick">Every pick</button>
  </span>
  <select class="select" id="sector-select"><option value="all">All sectors</option></select>
  <select class="select" id="conv-select">
    <option value="all">All convictions</option>
    <option value="Strong Buy">Strong Buy</option>
    <option value="Buy">Buy</option>
    <option value="Watch">Watch</option>
  </select>
  <span class="row-count" id="row-count"></span>
</div>

<div class="table-wrap">
  <div id="loading" class="empty">Loading picks...</div>
  <table class="main" id="picks-table" style="display:none;">
    <thead><tr id="head-row"></tr></thead>
    <tbody id="picks-body"></tbody>
  </table>
  <div id="empty-state" class="empty" style="display:none;">
    <div class="empty-title">No picks match</div>
    <div>Try another sector or conviction.</div>
  </div>
</div>

<div class="footer">STOCKPICKER &nbsp;·&nbsp; NOT FINANCIAL ADVICE &nbsp;·&nbsp; PRICES FROM THE LAST REFRESH</div>

<script>
// Chart site for the "chart" link next to each ticker. {t} is replaced with the ticker.
// Free alternatives: 'https://stockanalysis.com/stocks/{t}/chart/'
//                    'https://www.google.com/finance/quote/{t}'
const CHART_URL = 'https://www.tradingview.com/chart/?symbol={t}';
function chartUrl(t) { return CHART_URL.replace('{t}', encodeURIComponent(t)); }

let allPicks = [];
let view     = 'stock';     // 'stock' = one row per ticker, 'pick' = every pick
let sector   = 'all';
let conv     = 'all';
let sortKey  = null;        // null = default order for the view
let sortDir  = -1;
const openRows = new Set();

/* ── Helpers ─────────────────────────────────────────── */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = v => (v && v > 0) ? '$' + Number(v).toFixed(2) : '—';
function pct(v, cls) {
  if (v == null || isNaN(v)) return '<span class="flat">—</span>';
  const c = v > 0 ? 'pos' : (v < 0 ? 'neg' : 'flat');
  return `<span class="${c} ${cls || ''}">${v > 0 ? '+' : ''}${v.toFixed(1)}%</span>`;
}
function mktcap(v) {
  if (!v) return '—';
  if (v >= 1e12) return '$' + (v / 1e12).toFixed(2) + 'T';
  if (v >= 1e9)  return '$' + (v / 1e9).toFixed(1)  + 'B';
  if (v >= 1e6)  return '$' + (v / 1e6).toFixed(0)  + 'M';
  return '$' + v;
}
function daysSince(d) {
  return Math.max(0, Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 86400000));
}
function convBadge(c) {
  if (c === 'Strong Buy') return '<span class="badge badge-sb">Strong Buy</span>';
  if (c === 'Buy')        return '<span class="badge badge-buy">Buy</span>';
  return                         '<span class="badge badge-w">Watch</span>';
}
const CONV_RANK = { 'Strong Buy': 2, 'Buy': 1 };
function upsideTo(target, price) {
  return (target > 0 && price > 0) ? (target - price) / price * 100 : null;
}

/* ── Group picks by ticker ───────────────────────────── */
function groupByTicker(picks) {
  const map = new Map();
  for (const p of picks) {
    if (!map.has(p.ticker)) map.set(p.ticker, []);
    map.get(p.ticker).push(p);
  }
  return [...map.values()].map(list => {
    list.sort((a, b) => a.date.localeCompare(b.date));
    const first  = list[0];
    const latest = list[list.length - 1];
    const priced = [...list].reverse().find(p => p.cur_price > 0) || latest;
    const cur    = priced.cur_price || 0;
    const ret    = (cur > 0 && first.entry_price > 0) ? (cur - first.entry_price) / first.entry_price * 100 : (first.pct_chg ?? 0);
    const best   = list.reduce((a, p) => CONV_RANK[p.conviction] > CONV_RANK[a.conviction] ? p : a, list[0]);
    return {
      ticker: first.ticker, theme: latest.theme || first.theme || '',
      conviction: best.conviction, date: first.date, entry_price: first.entry_price,
      cur_price: cur, pct_chg: ret, analyst_target: latest.analyst_target,
      report_url: latest.report_url || first.report_url,
      status: list.some(p => (p.status || 'Open') === 'Open') ? 'Open' : 'Closed',
      count: list.length, picks: list,
      last_price_update: priced.last_price_update,
    };
  });
}

/* ── Columns per view ────────────────────────────────── */
const COLS = {
  stock: [
    { key: null,   label: '' },
    { key: 'ticker', label: 'Stock', sort: r => r.ticker },
    { key: 'conv', label: 'Conviction', sort: r => CONV_RANK[r.conviction] || 0 },
    { key: 'date', label: 'First Picked', sort: r => r.date },
    { key: 'entry', label: 'Entry', sort: r => r.entry_price },
    { key: 'cur', label: 'Now', sort: r => r.cur_price },
    { key: 'ret', label: 'Since 1st Pick', sort: r => r.pct_chg },
    { key: 'tgt', label: 'Target Upside', sort: r => upsideTo(r.analyst_target, r.cur_price) ?? -999 },
    { key: 'count', label: 'Picked', sort: r => r.count },
  ],
  pick: [
    { key: null,   label: '' },
    { key: 'date', label: 'Date', sort: r => r.date },
    { key: 'ticker', label: 'Stock', sort: r => r.ticker },
    { key: 'conv', label: 'Conviction', sort: r => CONV_RANK[r.conviction] || 0 },
    { key: 'entry', label: 'Entry', sort: r => r.entry_price },
    { key: 'cur', label: 'Now', sort: r => r.cur_price },
    { key: 'ret', label: 'Return', sort: r => r.pct_chg ?? 0 },
    { key: 'tgt', label: 'Target Upside', sort: r => upsideTo(r.analyst_target, r.cur_price) ?? -999 },
    { key: 'entryu', label: 'Upside @ Pick', sort: r => r.implied_upside_at_entry ?? -999 },
  ],
};

function renderHead() {
  document.getElementById('head-row').innerHTML = COLS[view].map(c => {
    if (!c.key) return '<th></th>';
    const cls = ['sortable', sortKey === c.key ? (sortDir === 1 ? 'sort-asc' : 'sort-desc') : ''].join(' ');
    return `<th class="${cls}" data-key="${c.key}">${c.label}</th>`;
  }).join('');
}

/* ── Row cells ───────────────────────────────────────── */
function stockCell(r) {
  const dot = (r.status || 'Open') === 'Open' ? 'dot-open' : 'dot-closed';
  return `<a class="ticker-link" href="${esc(r.report_url || chartUrl(r.ticker))}" target="_blank">${esc(r.ticker)}</a>
    <a class="chart-link" href="${chartUrl(r.ticker)}" target="_blank" title="Open chart">chart&nbsp;&#8599;</a>
    <div class="sub"><span class="${dot}">&#9679;</span> ${esc(r.theme)}</div>`;
}
function targetCell(r) {
  const u = upsideTo(r.analyst_target, r.cur_price);
  if (u == null) return '<span class="flat">—</span>';
  return `${pct(u)}<div class="sub">${money(r.analyst_target)}</div>`;
}
function rowCells(r) {
  if (view === 'stock') return `
    <td><span class="caret">&#9656;</span></td>
    <td>${stockCell(r)}</td>
    <td>${convBadge(r.conviction)}</td>
    <td class="num">${r.date}<div class="sub">${daysSince(r.date)}d ago</div></td>
    <td class="num price">${money(r.entry_price)}</td>
    <td class="num price">${money(r.cur_price)}</td>
    <td class="num">${pct(r.pct_chg, 'big')}</td>
    <td class="num">${targetCell(r)}</td>
    <td class="num">${r.count}&times;${r.count > 1 ? `<div class="sub">last ${r.picks[r.picks.length - 1].date}</div>` : ''}</td>`;
  return `
    <td><span class="caret">&#9656;</span></td>
    <td class="num">${r.date}<div class="sub">${daysSince(r.date)}d ago</div></td>
    <td>${stockCell(r)}</td>
    <td>${convBadge(r.conviction)}</td>
    <td class="num price">${money(r.entry_price)}</td>
    <td class="num price">${money(r.cur_price)}</td>
    <td class="num">${pct(r.pct_chg ?? 0, 'big')}</td>
    <td class="num">${targetCell(r)}</td>
    <td class="num">${pct(r.implied_upside_at_entry)}</td>`;
}

/* ── Detail row: every pick of the stock with its inputs ── */
function detailHtml(r) {
  const picks = r.picks || [r];
  const cur = r.cur_price || 0;
  const rows = picks.map(p => {
    const ret = (cur > 0 && p.entry_price > 0) ? (cur - p.entry_price) / p.entry_price * 100 : p.pct_chg;
    const regime = p.risk_on_at_entry == null ? '' : (p.risk_on_at_entry ? '<span class="risk-on">risk on</span>' : '<span class="risk-off">risk off</span>');
    const sigs = (p.signals || []).map(s => `<span class="sig">${esc(s.replace(/_/g, ' '))}</span>`).join('');
    return `<tr>
      <td class="num">${p.date}</td>
      <td>${convBadge(p.conviction)}</td>
      <td class="num price">${money(p.entry_price)}</td>
      <td class="num">${pct(ret)}</td>
      <td class="num">${money(p.analyst_target)} <span class="muted">(${pct(p.implied_upside_at_entry)})</span></td>
      <td class="num">${mktcap(p.mktcap)}</td>
      <td class="num">VIX ${p.vix_at_entry ?? '—'} ${regime}<div class="sub2">10Y ${p.yield_10y_at_entry != null ? p.yield_10y_at_entry + '%' : '—'}</div></td>
      <td>${sigs || '<span class="muted">—</span>'}</td>
      <td>${p.report_url ? `<a href="${esc(p.report_url)}" target="_blank">report</a>` : ''}</td>
    </tr>`;
  }).join('');
  return `<table class="subtable"><thead><tr>
      <th>Picked</th><th>Conviction</th><th>Entry</th><th>Return</th><th>Target @ pick</th><th>Mkt cap</th><th>Macro @ pick</th><th>Signals</th><th></th>
    </tr></thead><tbody>${rows}</tbody></table>`;
}

/* ── Stats ───────────────────────────────────────────── */
function renderStats(rows) {
  const n = rows.length;
  document.getElementById('l-total').textContent = view === 'stock' ? 'Stocks' : 'Picks';
  document.getElementById('s-total').textContent = n;
  if (!n) return;
  const rets  = rows.map(r => r.pct_chg || 0);
  const wins  = rets.filter(r => r > 0).length;
  const avg   = rets.reduce((a, b) => a + b, 0) / n;
  const mgd   = rets.map(r => Math.max(r, -10)).reduce((a, b) => a + b, 0) / n;   // losses stopped at -10%
  const bi = rets.indexOf(Math.max(...rets)), wi = rets.indexOf(Math.min(...rets));

  const wr = document.getElementById('s-wr');
  wr.textContent = (wins / n * 100).toFixed(0) + '%';
  wr.className = 'stat-value ' + (wins / n >= 0.5 ? 'green' : 'red');
  const av = document.getElementById('s-avg');
  av.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(1) + '%';
  av.className = 'stat-value ' + (avg >= 0 ? 'green' : 'red');
  document.getElementById('s-mgd').textContent = (mgd >= 0 ? '+' : '') + mgd.toFixed(1) + '% with a 10% stop';
  document.getElementById('s-best').textContent  = rows[bi].ticker + ' ' + (rets[bi] >= 0 ? '+' : '') + rets[bi].toFixed(1) + '%';
  document.getElementById('s-worst').textContent = rows[wi].ticker + ' ' + (rets[wi] >= 0 ? '+' : '') + rets[wi].toFixed(1) + '%';
}

/* ── Render ──────────────────────────────────────────── */
function render() {
  let rows = view === 'stock' ? groupByTicker(allPicks) : allPicks.map(p => ({ ...p, picks: [p] }));
  if (sector !== 'all') rows = rows.filter(r => r.theme === sector);
  if (conv !== 'all')   rows = rows.filter(r => (r.conviction === conv) || (conv === 'Watch' && !CONV_RANK[r.conviction]));

  const col = sortKey ? COLS[view].find(c => c.key === sortKey) : null;
  if (col) {
    rows.sort((a, b) => {
      const av = col.sort(a), bv = col.sort(b);
      if (typeof av === 'string') return sortDir * av.localeCompare(bv || '');
      return sortDir * ((av ?? 0) - (bv ?? 0));
    });
  } else if (view === 'stock') {
    rows.sort((a, b) => b.date.localeCompare(a.date));     // newest first pick first
  } else {
    rows.sort((a, b) => b.date.localeCompare(a.date));
  }

  renderHead();
  renderStats(rows);
  const body = document.getElementById('picks-body');
  body.innerHTML = rows.map(r => {
    const id = view + ':' + r.ticker + ':' + r.date;
    const open = openRows.has(id) ? ' open' : '';
    return `<tr class="row${open}" data-id="${esc(id)}">${rowCells(r)}</tr>
            <tr class="detail${open}"><td colspan="${COLS[view].length}">${detailHtml(r)}</td></tr>`;
  }).join('');

  document.getElementById('row-count').textContent = rows.length + (view === 'stock' ? ' stocks' : ' picks');
  document.getElementById('loading').style.display     = 'none';
  document.getElementById('empty-state').style.display = rows.length ? 'none' : 'block';
  document.getElementById('picks-table').style.display = rows.length ? 'table' : 'none';
}

/* ── Events ──────────────────────────────────────────── */
document.getElementById('view-seg').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn'); if (!btn) return;
  view = btn.dataset.view; sortKey = null;
  btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
});
document.getElementById('sector-select').addEventListener('change', e => { sector = e.target.value; render(); });
document.getElementById('conv-select').addEventListener('change', e => { conv = e.target.value; render(); });
document.getElementById('head-row').addEventListener('click', e => {
  const th = e.target.closest('th[data-key]'); if (!th) return;
  const k = th.dataset.key;
  if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
  render();
});
document.getElementById('picks-body').addEventListener('click', e => {
  if (e.target.closest('a')) return;
  const tr = e.target.closest('tr.row'); if (!tr) return;
  const id = tr.dataset.id;
  openRows.has(id) ? openRows.delete(id) : openRows.add(id);
  tr.classList.toggle('open');
  tr.nextElementSibling.classList.toggle('open');
});

async function loadPicks() {
  try {
    const res = await fetch('data/picks.json?t=' + Date.now());
    if (!res.ok) throw new Error('not found');
    allPicks = await res.json();

    const sectors = [...new Set(allPicks.map(p => p.theme).filter(Boolean))].sort();
    const sel = document.getElementById('sector-select');
    sel.insertAdjacentHTML('beforeend', sectors.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join(''));

    // ?sector= from email links
    const urlSector = new URLSearchParams(window.location.search).get('sector');
    if (urlSector && sectors.includes(urlSector)) { sector = urlSector; sel.value = urlSector; }

    const updates = allPicks.map(p => p.last_price_update || p.date).sort().reverse();
    document.getElementById('last-updated').textContent = 'Prices as of ' + (updates[0] || '—');
    document.getElementById('pick-count').textContent =
      new Set(allPicks.map(p => p.ticker)).size + ' stocks · ' + allPicks.length + ' picks';
    render();
  } catch (e) {
    document.getElementById('loading').textContent = 'No picks data yet.';
  }
}
loadPicks();
</script>
</body>
</html>
