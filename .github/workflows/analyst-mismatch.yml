name: Analyst Mismatch Scan

on:
  schedule:
    # Mondays before the US open (12:15 UTC). The weekly brief goes out Tuesday.
    - cron: '15 12 * * 1'
  workflow_dispatch:   # manual trigger from GitHub UI

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance
      - name: Scan for analyst mismatches
        run: python scripts/analyst_mismatch.py
      - name: Rebuild agent views
        run: python scripts/build_agent_views.py
        env:
          AGENT_BASE: ${{ vars.AGENT_BASE }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Analyst mismatch scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 15; done
