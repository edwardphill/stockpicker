name: Analyst Mismatch Scan

on:
  schedule:
    # Mondays before the US open (12:15 UTC). The weekly brief goes out Tuesday.
    - cron: '15 12 * * 1'
  workflow_dispatch:   # manual trigger from GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance
      - name: Scan for analyst mismatches
        run: python scripts/analyst_mismatch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
