name: Refresh Stock Prices

on:
  schedule:
    # Every 30 min Mon-Fri 9:30-16:30 ET (13:30-21:30 UTC)
    - cron: '0,30 13,14,15,16,17,18,19,20,21 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance
      - name: Refresh prices
        run: python scripts/refresh_prices.py
      - name: Rebuild agent views
        run: python scripts/build_agent_views.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Refresh prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 15; done
