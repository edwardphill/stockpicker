name: Weekly Brief

on:
  schedule:
    # Tuesdays before the US open (12:30 UTC), the morning after Monday's scan.
    - cron: '30 12 * * 2'
  workflow_dispatch:   # manual trigger from GitHub UI

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and send the weekly brief
        run: python scripts/weekly_brief.py
        env:
          # Email goes out only when these three repository secrets exist.
          # Gmail: MAIL_USERNAME is the address, MAIL_PASSWORD an app password.
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
      - name: Rebuild agent views
        run: python scripts/build_agent_views.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Weekly brief $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 15; done
