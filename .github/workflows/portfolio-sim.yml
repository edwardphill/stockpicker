name: Portfolio Simulation

on:
  schedule:
    # Weekdays after the US close (21:45 UTC): replay the stop rules on the day's closes.
    - cron: '45 21 * * 1-5'
  workflow_dispatch:   # manual trigger from GitHub UI

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install yfinance
      - name: Replay the stop rules
        run: python scripts/portfolio_sim.py
      - name: Rebuild agent views
        run: python scripts/build_agent_views.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Portfolio simulation $(date -u '+%Y-%m-%d')"
          for i in 1 2 3; do git pull --rebase origin main && git push && break || sleep 15; done
